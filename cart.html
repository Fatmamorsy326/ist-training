<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart | PinkShop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>


    <main class="py-4 py-lg-5">

        <div class="container">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h1 class="fw-bold mb-0">
                    My Cart
                </h1>



            </div>

            <div class="row g-4">

                <div class="col-12 col-lg-8">
                    <div id="cart-items"></div>

                    <div id="empty-cart-message" class="text-center py-5 d-none">
                        <i class="fa-solid fa-cart-shopping fs-1 social-link mb-3"></i>

                        <h3>Your cart is empty</h3>

                        <a href="index.html#products" class="btn started-Btn mt-3">
                            Continue Shopping
                        </a>
                    </div>
                </div>

                <div class="col-12 col-lg-4">

                    <div class="card border-0 shadow-sm rounded-4">

                        <div class="card-body p-4">

                            <h4 class="fw-bold mb-4">
                                Order Summary
                            </h4>

                            <div class="d-flex justify-content-between mb-3">

                                <span class="social-link">
                                    Subtotal
                                </span>

                                <span class="fw-semibold" id="cart-subtotal">
                                    $0.00
                                </span>

                            </div>

                            <div class="d-flex justify-content-between mb-3">

                                <span class="social-link">
                                    Delivery
                                </span>

                                <span class="fw-semibold" id="delivery-cost">
                                    $5.00
                                </span>

                            </div>

                            <hr>

                            <div class="d-flex justify-content-between mb-4">

                                <span class="fw-bold">
                                    Total
                                </span>

                                <span class="product-details-price fs-4" id="cart-total">
                                    $0.00
                                </span>

                            </div>

                            <div class="d-grid">

                                <button type="button" class="btn started-Btn py-2" id="checkout-button">
                                    Proceed To Checkout
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer class="contact-section text-center py-4 mt-5">

        <p class="social-link mb-0">
            © 2026 PinkShop. All rights reserved.
        </p>

    </footer>

    <script src="js/all.min.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/main.js"></script>

</body>

</html>
