<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pink Handbag | PinkShop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="product-details-section">

        <div class="container">

            <div class="row align-items-center g-5 mt-2">

                <div class="col-12 col-md-6">

                    <div class="product-details-image-container">

                        <img src="images/image.png" class="product-details-image" id="details-image" alt="Pink Handbag">
                    </div>

                </div>

                <div class="col-12 col-md-6">

                    <span class="product-category" id="details-category">
                        Accessories
                    </span>

                    <h1 class="product-details-title mt-2" id="details-name">
                        Pink Handbag
                    </h1>

                    <div class="product-rating mb-3">

                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-regular fa-star"></i>

                        <span class="social-link ms-2">
                            4.0
                        </span>

                    </div>

                    <p class="product-details-price" id="details-price">
                        $35.00
                    </p>

                    <p class="product-description" id="details-description">
                        A stylish pink handbag suitable for everyday use.
                    </p>

                    <hr>

                    <div class="mb-4">

                        <h6 class="fw-bold">
                            Availability
                        </h6>

                        <span class="stock-status">
                            <i class="fa-solid fa-circle-check"></i>
                            In Stock
                        </span>

                    </div>

                    <button type="button" class="btn started-Btn px-4 py-2" id="product-details-add-button" data-id="1"
                        data-name="Pink Handbag" data-price="35" data-category="Accessories"
                        data-image="images/image.png">
                        <i class="fa-solid fa-cart-plus me-1"></i>
                        Add To Cart
                    </button>

                </div>

            </div>

        </div>

    </main>

    <footer class="contact-section text-center py-4 mt-5">

        <p class="social-link mb-0">
            © 2026 PinkShop. All rights reserved.
        </p>

    </footer>

    <script src="js/all.min.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/main.js"></script>

</body>

</html>
